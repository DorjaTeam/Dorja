<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Dorja</title>
    <meta name="description" content="Gestiona tu perfil, logros y configuración en la plataforma educativa Dorja.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/dorja-design-system.css" rel="stylesheet">
    <style>
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        .achievement-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--glass-1);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .achievement-badge:hover {
            border-color: rgba(138,93,245,0.35);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .achievement-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .achievement-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }

        .achievement-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .no-progress-box {
            text-align: center;
            padding: 40px 20px;
            border: 1.5px dashed var(--glass-border);
            border-radius: var(--radius);
        }

        .no-progress-box p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .config-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .config-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-muted);
            text-align: left;
            width: 100%;
            transition: var(--transition);
        }

        .config-item:hover {
            background: var(--glass-1);
            color: var(--text);
        }

        .config-item.danger {
            color: var(--danger);
        }

        .config-item.danger:hover {
            background: rgba(239,68,68,0.08);
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px;
        }

        .profile-main { display: flex; flex-direction: column; gap: 24px; }
        .profile-side { display: flex; flex-direction: column; gap: 24px; }

        @media (max-width: 860px) {
            .profile-layout {
                grid-template-columns: 1fr;
                padding: 16px;
            }
        }

        /* spinner for loading state */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        /* file input styling */
        .file-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            background: var(--glass-1);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--text-sm);
            color: var(--text-muted);
            transition: var(--transition);
        }

        .file-label:hover {
            background: var(--accent-soft);
            border-color: rgba(138,93,245,0.4);
            color: var(--accent);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="home.html" class="navbar-brand" style="display:flex; align-items:center;">
            <img src="./assets/images/dorja-logo-text.png" alt="Dorja" style="height: 36px; object-fit: contain;" onerror="this.outerHTML='<div class=\'brand-icon\'>D</div><span class=\'brand-name\'>Dorja</span>'">
        </a>
        <div class="navbar-spacer"></div>
        <a href="home.html" class="navbar-link"><i class="fas fa-arrow-left" style="margin-right:6px;"></i>Volver al Inicio</a>
    </nav>

    <!-- Profile Card (banner + avatar + name) -->
    <div class="profile-layout">
        <div class="profile-main">
            <div class="profile-card">
                <!-- Banner -->
                <div class="profile-banner">
                    <img id="cover-photo" src="" alt="Foto de portada"
                        onerror="this.style.display='none'">
                </div>

                <!-- Avatar + name -->
                <div class="profile-info-section">
                    <div class="profile-identity">
                        <div class="profile-avatar-ring">
                            <img id="profile-photo" src="" alt="Foto de perfil"
                                onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex'">
                            <div id="avatar-fallback" class="avatar-fallback" style="display:none">👤</div>
                        </div>
                        <div class="profile-name-block">
                            <h2 id="profile-username">Cargando...</h2>
                            <div class="profile-email" id="profile-email">Cargando...</div>
                        </div>
                        <button id="edit-profile-btn" class="btn btn-ghost btn-sm">✏️ Editar Perfil</button>
                    </div>
                </div>
            </div>

            <!-- Mi Avance -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📈 Mi Avance</span>
                </div>
                <div id="no-progress-view" class="no-progress-box">
                    <p>Aún no has comenzado ningún curso.</p>
                    <a href="Exercises.html" class="btn btn-primary">Iniciar Curso</a>
                </div>
                <div id="progress-view" style="display:none">
                    <!-- populated by profile.js -->
                </div>
            </div>

            <!-- Logros -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🏆 Logros Conseguidos</span>
                </div>
                <div id="achievements-container" class="achievements-grid">
                    <div style="grid-column: 1/-1; text-align:center; padding: 32px;">
                        <div class="spinner"></div>
                        <p style="color:var(--text-muted); font-size:0.88rem;">Cargando logros...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Side: Configuración -->
        <div class="profile-side">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">⚙️ Configuración</span>
                </div>
                <div class="config-list">
                    <button id="change-password-btn" class="config-item">🔑 Cambiar contraseña</button>
                    <button id="delete-account-btn" class="config-item danger">🗑️ Eliminar mi cuenta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Edit Profile Modal ── -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <div class="modal-title">Editar Perfil</div>
                    <div class="modal-subtitle">Actualiza tu información personal</div>
                </div>
                <button class="modal-close" id="cancel-edit-btn">✕</button>
            </div>
            <div class="modal-body">
                <form id="edit-profile-form">
                    <div class="form-group">
                        <label for="edit-username">Nombre de Usuario</label>
                        <input type="text" id="edit-username" class="input-field" placeholder="Tu username">
                    </div>
                    <div class="form-group">
                        <label for="edit-email">Email</label>
                        <input type="email" id="edit-email" class="input-field" placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Foto de perfil</label>
                        <label for="profile-photo-input" class="file-label">
                            📷 Seleccionar imagen
                        </label>
                        <input type="file" id="profile-photo-input" accept="image/png, image/jpeg">
                    </div>
                    <div class="form-group">
                        <label>Foto de portada</label>
                        <label for="cover-photo-input" class="file-label">
                            🖼️ Seleccionar imagen
                        </label>
                        <input type="file" id="cover-photo-input" accept="image/png, image/jpeg">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="cancel-edit-btn-2" class="btn btn-ghost">Cancelar</button>
                <button id="save-edit-btn" class="btn btn-primary">💾 Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- ── Change Password Modal ── -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <div class="modal-title">Cambiar Contraseña</div>
                    <div class="modal-subtitle">Ingresa tu contraseña actual y la nueva</div>
                </div>
                <button class="modal-close" id="close-password-modal">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="current-password">Contraseña actual</label>
                    <input type="password" id="current-password" class="input-field" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="new-password">Nueva contraseña</label>
                    <input type="password" id="new-password" class="input-field" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar nueva contraseña</label>
                    <input type="password" id="confirm-password" class="input-field" placeholder="••••••••">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="close-password-modal-2">Cancelar</button>
                <button id="save-password-btn" class="btn btn-primary">🔒 Guardar Contraseña</button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="./api.js"></script>
    <script src="./js/achievements.js"></script>
    <script src="./js/profile.js"></script>
    <script>
        // Wire up modal close buttons (in addition to what profile.js handles)
        document.getElementById('cancel-edit-btn')?.addEventListener('click', () => {
            document.getElementById('edit-modal').classList.remove('open');
        });
        document.getElementById('cancel-edit-btn-2')?.addEventListener('click', () => {
            document.getElementById('edit-modal').classList.remove('open');
        });
        document.getElementById('edit-profile-btn')?.addEventListener('click', () => {
            document.getElementById('edit-modal').classList.add('open');
        });
        document.getElementById('close-password-modal')?.addEventListener('click', () => {
            document.getElementById('password-modal').classList.remove('open');
        });
        document.getElementById('close-password-modal-2')?.addEventListener('click', () => {
            document.getElementById('password-modal').classList.remove('open');
        });
        document.getElementById('change-password-btn')?.addEventListener('click', () => {
            document.getElementById('password-modal').classList.add('open');
        });
        // Close modal on overlay click
        ['edit-modal','password-modal'].forEach(id => {
            const el = document.getElementById(id);
            el?.addEventListener('click', (e) => {
                if (e.target === el) el.classList.remove('open');
            });
        });
    </script>
</body>

</html>
