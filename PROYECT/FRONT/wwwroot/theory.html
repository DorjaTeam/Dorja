<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teoría - Dorja</title>
    <meta name="description" content="Aprende los conceptos teóricos de programación en la plataforma educativa Dorja.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/dorja-design-system.css" rel="stylesheet">
    <style>
        .theory-page-content {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* Section cards spacing */
        .theory-sections {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Override inline Tailwind colors inserted by JS with design system equivalents */
        .theory-sections p { color: var(--text-muted); }
        .theory-sections strong { color: var(--text); }
        .theory-sections ul li { color: var(--text-muted); }

        /* Spinner */
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="home.html" class="navbar-brand">
            <div class="brand-icon">D</div>
            <span class="brand-name">Dorja</span>
        </a>
        <div class="navbar-spacer"></div>
        <a href="niveles.html" class="navbar-link"><i class="fas fa-arrow-left" style="margin-right:6px;"></i>Volver a Niveles</a>
    </nav>

    <main>
        <div class="theory-page-content">
            <!-- Page Hero -->
            <div class="page-hero" id="theory-hero">
                <div class="hero-icon-wrap" id="tema-icon-wrap">
                    <span id="tema-icon-emoji">📚</span>
                </div>
                <h1 id="tema-titulo">Cargando...</h1>
                <p id="tema-descripcion">Cargando descripción...</p>
            </div>

            <!-- Theory Sections -->
            <div id="theory-content" class="theory-sections">
                <div style="text-align:center; padding: 60px 0;">
                    <div class="loading-spinner"></div>
                    <p style="color:var(--text-muted); margin-top:18px;">Cargando contenido...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <script src="./api.js"></script>
    <script>
        const urlParams  = new URLSearchParams(window.location.search);
        const temaId     = urlParams.get('temaId');
        const temaTitulo = urlParams.get('titulo') || 'Teoría';

        // Map emoji icons per tema name
        const temaEmoji = {
            'Lógica de programación': '🧠',
            'Programación orientada a objetos': '📦',
            'Fundamentos de bases de datos': '🗄️'
        };

        // Theory content per tema
        const teoriaContenido = {
            'Lógica de programación': {
                secciones: [
                    {
                        titulo: 'Introducción',
                        contenido: `
                            <p>La lógica de programación es la base fundamental de cualquier lenguaje de programación.
                            Comprender los conceptos básicos te permitirá resolver problemas de manera eficiente y estructurada.</p>
                            <div class="highlight-box-ds">
                                <strong>💡 Concepto clave:</strong> La programación es el arte de dar instrucciones claras y precisas a una computadora.
                            </div>
                        `
                    },
                    {
                        titulo: 'Variables y Tipos de Datos',
                        contenido: `
                            <p>Las variables son contenedores que almacenan información. En Python, puedes crear una variable simplemente asignándole un valor.</p>
                            <div class="code-block-ds"><code># Variables en Python
nombre = "Juan"
edad = 25
altura = 1.75
activo = True

# Tipos de datos
print(type(nombre))  # &lt;class 'str'&gt;
print(type(edad))    # &lt;class 'int'&gt;
print(type(altura))  # &lt;class 'float'&gt;
print(type(activo))  # &lt;class 'bool'&gt;</code></div>
                            <ul class="theory-prose" style="list-style:disc; padding-left:20px;">
                                <li><strong>str</strong>: Cadenas de texto (strings)</li>
                                <li><strong>int</strong>: Números enteros</li>
                                <li><strong>float</strong>: Números decimales</li>
                                <li><strong>bool</strong>: Valores booleanos (True/False)</li>
                            </ul>
                        `
                    },
                    {
                        titulo: 'Estructuras Condicionales',
                        contenido: `
                            <p>Las estructuras condicionales permiten que tu programa tome decisiones basadas en condiciones.</p>
                            <div class="code-block-ds"><code># Estructura if-else
edad = 18

if edad >= 18:
    print("Eres mayor de edad")
else:
    print("Eres menor de edad")

# Múltiples condiciones con elif
nota = 85

if nota >= 90:
    print("Excelente")
elif nota >= 70:
    print("Buen trabajo")
else:
    print("Necesitas estudiar más")</code></div>
                        `
                    },
                    {
                        titulo: 'Bucles y Repetición',
                        contenido: `
                            <p>Los bucles permiten repetir una acción múltiples veces, ahorrando código y haciendo tu programa más eficiente.</p>
                            <div class="code-block-ds"><code># Bucle for
for i in range(5):
    print(f"Número: {i}")

# Bucle while
contador = 0
while contador &lt; 5:
    print(f"Contador: {contador}")
    contador += 1

# Iterar sobre una lista
frutas = ["manzana", "banana", "naranja"]
for fruta in frutas:
    print(f"Me gusta la {fruta}")</code></div>
                        `
                    }
                ]
            },
            'Programación orientada a objetos': {
                secciones: [
                    {
                        titulo: 'Introducción a POO',
                        contenido: `
                            <p>La Programación Orientada a Objetos (POO) es un paradigma que organiza el código en objetos que contienen datos y métodos.</p>
                            <div class="highlight-box-ds">
                                <strong>💡 Conceptos fundamentales:</strong> Clases, Objetos, Herencia, Encapsulación y Polimorfismo.
                            </div>
                        `
                    },
                    {
                        titulo: 'Clases y Objetos',
                        contenido: `
                            <p>Una clase es un molde que define las características y comportamientos de un objeto.</p>
                            <div class="code-block-ds"><code># Definir una clase
class Persona:
    def __init__(self, nombre, edad):
        self.nombre = nombre
        self.edad = edad

    def saludar(self):
        return f"Hola, soy {self.nombre} y tengo {self.edad} años"

# Crear un objeto (instancia)
persona1 = Persona("Ana", 25)
print(persona1.saludar())</code></div>
                        `
                    },
                    {
                        titulo: 'Herencia',
                        contenido: `
                            <p>La herencia permite crear nuevas clases basadas en clases existentes, reutilizando código.</p>
                            <div class="code-block-ds"><code>class Persona:
    def __init__(self, nombre):
        self.nombre = nombre

    def presentarse(self):
        return f"Soy {self.nombre}"

class Estudiante(Persona):
    def __init__(self, nombre, carrera):
        super().__init__(nombre)
        self.carrera = carrera

    def estudiar(self):
        return f"{self.nombre} está estudiando {self.carrera}"

estudiante = Estudiante("Carlos", "Ingeniería")
print(estudiante.presentarse())
print(estudiante.estudiar())</code></div>
                        `
                    }
                ]
            },
            'Fundamentos de bases de datos': {
                secciones: [
                    {
                        titulo: 'Introducción a Bases de Datos',
                        contenido: `
                            <p>Una base de datos es un sistema organizado para almacenar, gestionar y recuperar información de manera eficiente.</p>
                            <div class="highlight-box-ds">
                                <strong>🗄️ SQL</strong> (Structured Query Language) es el lenguaje estándar para interactuar con bases de datos relacionales.
                            </div>
                        `
                    },
                    {
                        titulo: 'Consultas SELECT',
                        contenido: `
                            <p>La consulta SELECT permite recuperar datos de una o más tablas.</p>
                            <div class="code-block-ds"><code>-- Seleccionar todas las columnas
SELECT * FROM usuarios;

-- Seleccionar columnas específicas
SELECT nombre, email FROM usuarios;

-- Con condiciones WHERE
SELECT * FROM usuarios WHERE edad &gt; 18;

-- Ordenar resultados
SELECT * FROM usuarios ORDER BY nombre ASC;</code></div>
                        `
                    },
                    {
                        titulo: 'Operaciones CRUD',
                        contenido: `
                            <p>CRUD son las operaciones básicas: Create (INSERT), Read (SELECT), Update (UPDATE) y Delete (DELETE).</p>
                            <div class="code-block-ds"><code>-- INSERT: Crear nuevos registros
INSERT INTO usuarios (nombre, email)
VALUES ('Juan', 'juan@email.com');

-- UPDATE: Actualizar registros
UPDATE usuarios
SET email = 'nuevo@email.com'
WHERE id = 1;

-- DELETE: Eliminar registros
DELETE FROM usuarios WHERE id = 1;</code></div>
                        `
                    }
                ]
            }
        };

        async function loadTheory() {
            const contentDiv  = document.getElementById('theory-content');
            const tituloDiv   = document.getElementById('tema-titulo');
            const descripDiv  = document.getElementById('tema-descripcion');
            const iconWrap    = document.getElementById('tema-icon-wrap');
            const iconEmoji   = document.getElementById('tema-icon-emoji');

            let temaNombre = temaTitulo;

            // Try to load tema from API
            if (temaId) {
                try {
                    const resp = await window.api._makeRequest(`/Temas/${temaId}`);
                    const tema = resp.data || resp;
                    if (tema) {
                        temaNombre = tema.Titulo || temaTitulo;
                        tituloDiv.textContent = temaNombre;
                        descripDiv.textContent = tema.Descripcion || 'Aprende los conceptos fundamentales de este tema.';
                    }
                } catch (err) {
                    console.error('Error al cargar tema:', err);
                    tituloDiv.textContent = temaTitulo;
                }
            } else {
                tituloDiv.textContent = temaTitulo;
            }

            // Set emoji icon
            const emoji = temaEmoji[temaNombre] || '📚';
            iconEmoji.textContent = emoji;

            // Resolve teoria data
            const teoria = teoriaContenido[temaNombre] || teoriaContenido['Lógica de programación'];

            // Render sections as design system theory cards
            let html = '';
            teoria.secciones.forEach((seccion, index) => {
                html += `
                    <div class="theory-card">
                        <div class="theory-card-header">
                            <div class="theory-card-num">${index + 1}</div>
                            <h2>${seccion.titulo}</h2>
                        </div>
                        <div class="theory-prose">
                            ${seccion.contenido}
                        </div>
                    </div>
                `;
            });

            contentDiv.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadTheory);
    </script>
</body>

</html>
